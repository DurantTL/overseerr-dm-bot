services:
  overseerr-dm-bot:
    # Prebuilt image published to GHCR by .github/workflows/build-image.yml.
    # Override the tag with BOT_IMAGE_TAG to pin a specific build
    # (e.g. sha-abc1234) instead of tracking latest.
    image: ghcr.io/duranttl/overseerr-dm-bot:${BOT_IMAGE_TAG:-latest}
    # `build` is kept as a local fallback: `docker compose build` (or `up --build`)
    # still works for development, but normal deploys pull the image above.
    build: .
    # Load-bearing next to `build`. Compose's default policy ("missing") only pulls when no
    # local image carries this tag — and when a `build` section exists it BUILDS instead of
    # pulling. So a plain `docker compose up -d` on a host that already has an
    # overseerr-dm-bot:latest (a stale pull, or one Portainer built from the Git checkout)
    # silently re-runs that old image: the container comes up clean, the logs look healthy,
    # and none of the code you just shipped is actually running. `always` makes every `up`
    # reconcile against GHCR. If the pull fails (private package, no `docker login ghcr.io`)
    # the deploy now fails loudly instead of quietly running yesterday's build.
    pull_policy: always
    container_name: overseerr-dm-bot
    init: true
    labels:
      # Opt this container in to Watchtower auto-updates (required when
      # Watchtower runs with WATCHTOWER_LABEL_ENABLE; harmless otherwise).
      - "com.centurylinklabs.watchtower.enable=true"
    env_file:
      # Compose keeps the LAST duplicate value, so stack.env (written by
      # Portainer from UI vars) must come after .env to take precedence.
      - path: .env
        required: false
      - path: stack.env
        required: false
    ports:
      # Container side must match PORT (default 3000). Compose only interpolates from the shell
      # and the project .env — never from env_file — so a PORT set in stack.env would not be
      # visible here; change both sides by hand if you ever move off 3000.
      - "3000:3000"
    volumes:
      - durant_bot_data:/app/data
      # Plex Home staging: drop rclone.conf into this volume (/app/data/rclone.conf)
      # and set STAGE_RCLONE_FLAGS=--config /app/data/rclone.conf
      - ${MEDIA_HOST_PATH:-/mnt/raid}:/mnt/raid:ro
      # AvistaZ direct grab: the media mount above is read-only, so the seedbox staging
      # folder needs its own WRITABLE mount that Radarr/Sonarr can also see. Uncomment and
      # set GRAB_STAGING_PATH=/seedbox-staging (GRAB_IMPORT_PATH = the same folder as the
      # arrs see it, e.g. /share/seedbox-staging).
      # - ${SEEDBOX_STAGING_HOST_PATH:-/mnt/raid/media/seedbox-staging}:/seedbox-staging
    restart: unless-stopped
    healthcheck:
      # Reads PORT from inside the container, so it follows env_file (which compose-level
      # interpolation cannot see).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: overseerr-dm-bot-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  durant_bot_data:
