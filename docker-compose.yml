services:
  durant-media-server-bot:
    # Prebuilt image published to GHCR by .github/workflows/build-image.yml.
    # Override the tag with BOT_IMAGE_TAG to pin a specific build
    # (e.g. sha-abc1234) instead of tracking latest.
    image: ghcr.io/duranttl/overseerr-dm-bot:${BOT_IMAGE_TAG:-latest}
    # `build` is kept as a local fallback: `docker compose build` still works
    # for development, but normal deploys pull the image above.
    build: .
    container_name: durant-media-server-bot
    init: true
    labels:
      # Opt this container in to Watchtower auto-updates (required when
      # Watchtower runs with WATCHTOWER_LABEL_ENABLE; harmless otherwise).
      - "com.centurylinklabs.watchtower.enable=true"
    env_file:
      # Compose keeps the LAST duplicate value, so stack.env (written by
      # Portainer from UI vars) must come after .env to take precedence.
      - path: .env
        required: false
      - path: stack.env
        required: false
    ports:
      - "3000:3000"
    volumes:
      - durant_bot_data:/app/data
      - ${MEDIA_HOST_PATH:-/mnt/raid}:/mnt/raid:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: durant-media-server-bot-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  durant_bot_data:
