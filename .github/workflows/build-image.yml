name: Build and publish image

# Builds the bot's Docker image on every push to the deploy branch and pushes
# it to the GitHub Container Registry (GHCR). The Docker host then auto-updates
# via Watchtower when the new image lands — no inbound access to the host or
# Portainer is required.
#
# The image is published to:
#   ghcr.io/<owner>/<repo>:latest        (moving tag, tracks main)
#   ghcr.io/<owner>/<repo>:sha-<commit>  (immutable, for rollbacks — see DEPLOYMENT.md)
#   ghcr.io/<owner>/<repo>:vX.Y.Z        (immutable, only when a vX.Y.Z tag is pushed)
#
# Pushing a `vX.Y.Z` git tag (after bumping package.json's version to match) publishes that
# semantic-version tag and creates a GitHub Release with auto-generated notes; it does not touch
# `latest`, since a version tag is not a push to the main branch.
#
# Before publishing, the image is scanned for known vulnerabilities (#184): a fixable
# CRITICAL/HIGH finding fails the build rather than reaching GHCR — see DEPLOYMENT.md for the
# severity policy and how to handle a blocked release. Published images also carry an SBOM and
# build-provenance attestation (readable with `docker buildx imagetools inspect --format
# '{{ json .SBOM }}' <image>` / `docker scout` / `cosign verify-attestation`).
#
# First-time note: the GHCR package is created as PRIVATE. To let the host pull
# without credentials, open the package on GitHub (Profile -> Packages ->
# this image -> Package settings) and set visibility to Public. If you keep it
# private, the host (and Watchtower) must `docker login ghcr.io` with a PAT.

on:
  push:
    branches:
      - main # deploy branch; change if you deploy from a different branch
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build once locally and scan it before anything is published: a vulnerable image must never
      # be discoverable only after it already reached GHCR and Watchtower auto-updated the host.
      # The publish step below reuses this build's cache, so it does not pay for the build twice.
      - name: Build (local, for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: overseerr-dm-bot:scan-target
          build-args: |
            GIT_SHA=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: overseerr-dm-bot:scan-target
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so the bot's "Bot Online" deploy ping can report its version.
          build-args: |
            GIT_SHA=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  release:
    # Only version-tag pushes need repository write permission; image builds never do.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
