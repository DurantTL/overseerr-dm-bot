name: Build and publish image

# Builds the bot's Docker image on every push to the deploy branch and pushes
# it to the GitHub Container Registry (GHCR). The Docker host then auto-updates
# via Watchtower when the new image lands — no inbound access to the host or
# Portainer is required.
#
# The image is published to:
#   ghcr.io/<owner>/<repo>:latest   (plus a :sha-<commit> tag for rollbacks)
#
# First-time note: the GHCR package is created as PRIVATE. To let the host pull
# without credentials, open the package on GitHub (Profile -> Packages ->
# this image -> Package settings) and set visibility to Public. If you keep it
# private, the host (and Watchtower) must `docker login ghcr.io` with a PAT.

on:
  push:
    branches:
      - main # deploy branch; change if you deploy from a different branch
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so the bot's "Bot Online" deploy ping can report its version.
          build-args: |
            GIT_SHA=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
